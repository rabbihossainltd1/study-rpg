name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup npmrc
        working-directory: frontend
        run: |
          if [ -f ".npmrc.txt" ]; then
            cp .npmrc.txt .npmrc
          fi
          echo "legacy-peer-deps=true" >> .npmrc

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Create .env.local
        working-directory: frontend
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env.local
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env.local
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_NAME=Study RPG" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=https://project-wzy1z.vercel.app" >> .env.local
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.local

      - name: Build Next.js
        working-directory: frontend
        run: npm run build

      - name: Fix Capacitor Static Paths
        working-directory: frontend
        run: node scripts/fix-capacitor-static-assets.js

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Add google-services.json
        working-directory: frontend/android/app
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          else
            cp google-services.json.example google-services.json
          fi

      - name: Download Gradle Wrapper JAR
        working-directory: frontend/android
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          sed -i 's/DEFAULT_JVM_OPTS=""/DEFAULT_JVM_OPTS=""/g' gradlew

      - name: Build APK
        working-directory: frontend/android
        env:
          JAVA_TOOL_OPTIONS: ""
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
