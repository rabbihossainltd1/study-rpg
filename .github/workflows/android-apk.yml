name: Build Study RPG APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Create .env.local
        working-directory: frontend
        run: |
          cat > .env.local <<'ENVEOF'
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          ENVEOF

      - name: Build Next.js + fix asset paths
        working-directory: frontend
        run: npm run build

      - name: Verify out/next exists
        working-directory: frontend
        run: |
          test -d out/next/static
          test -f out/index.html
          ! grep -R '/_next/\|\\/_next\\/' out --include='*.html' --include='*.js' --include='*.css'

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Verify android assets
        working-directory: frontend
        run: |
          test -d android/app/src/main/assets/public/next/static
          test -f android/app/src/main/assets/public/index.html
          ! find android/app/src/main/assets/public -path '*/_next/*' -print -quit | grep .

      - name: Verify google-services.json
        working-directory: frontend
        run: test -f android/app/google-services.json

      - name: Setup signing keystore
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass "${KEYSTORE_PASSWORD:-studyrpg456}" \
            -keypass "${KEY_PASSWORD:-studyrpg456}" \
            -alias "${KEY_ALIAS:-studyrpg2}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Study RPG,O=Rabbi Hossain,C=BD"

      - name: Build APK
        working-directory: frontend/android
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-rpg-v1.3.1-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
